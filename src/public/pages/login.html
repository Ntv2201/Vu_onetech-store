<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @keyframes bgFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.08; }
      50%       { transform: translateY(-30px) rotate(180deg); opacity: 0.15; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes logoSpin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    @keyframes gradientBg {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0c1a2e 70%, #1a1035 100%);
      background-size: 400% 400%;
      animation: gradientBg 12s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      animation: bgFloat 8s ease-in-out infinite;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(37,99,235,0.3), transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(56,189,248,0.2), transparent 70%);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 1.25rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
      padding: 2.5rem;
      position: relative;
      z-index: 1;
      animation: cardIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(4px);
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
      transition: transform 0.4s ease;
    }

    .brand-logo:hover {
      animation: logoSpin 0.8s ease;
    }

    .brand-title {
      background: linear-gradient(135deg, #1e293b, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-control, .form-select {
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      transform: scale(1.01);
    }

    .btn-login {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 6px 20px rgba(37,99,235,0.5);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: scale(0.97);
    }

    .input-group-text {
      background: #f8fafc;
      border-right: none;
      color: #64748b;
    }

    .input-group .form-control {
      border-left: none;
    }

    .input-group .form-control:focus {
      border-left: none;
      transform: none;
    }

    .input-group:focus-within {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      border-radius: 0.375rem;
    }

    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
      border-color: #3b82f6;
    }

    .demo-account-badge {
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      transition: all 0.18s;
      user-select: none;
    }

    .demo-account-badge:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(37,99,235,0.1);
    }

    .demo-account-badge:active {
      transform: scale(0.95);
    }

    .divider-text {
      position: relative;
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .divider-text::before, .divider-text::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e2e8f0;
    }

    .divider-text::before { left: 0; }
    .divider-text::after  { right: 0; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand-logo">
    <i class="bi bi-phone-vibrate"></i>
  </div>
  <h4 class="text-center fw-bold mb-1 brand-title">ONE TECH STORE</h4>
  <p class="text-center text-muted small mb-4">Hệ thống Quản lý Chuỗi Cửa hàng Điện thoại</p>

  <div id="loginAlert" class="alert alert-danger py-2 small d-none align-items-center mb-3" style="border-radius: 0.625rem;">
    <i class="bi bi-exclamation-circle-fill me-2"></i>
    <span id="loginAlertText"></span>
  </div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Tên đăng nhập</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="inputUsername" class="form-control" placeholder="admin / banhang / thukho..." required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-semibold">Mật khẩu</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="inputPassword" class="form-control" placeholder="Nhập mật khẩu" required>
      </div>
    </div>

    <button type="submit" id="btnSubmit" class="btn btn-login btn-primary w-100 py-2 mb-3">
      <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập hệ thống
    </button>
  </form>

  <div class="divider-text mb-3">Tài khoản demo</div>

  <div class="d-flex flex-wrap gap-1">
    <span class="demo-account-badge" onclick="fillCreds('admin', 'admin123')">
      <strong>Quản lý:</strong> admin
    </span>
    <span class="demo-account-badge" onclick="fillCreds('banhang', '123456')">
      <strong>Bán hàng:</strong> banhang
    </span>
    <span class="demo-account-badge" onclick="fillCreds('thukho', '123456')">
      <strong>Thủ kho:</strong> thukho
    </span>
    <span class="demo-account-badge" onclick="fillCreds('thungan', '123456')">
      <strong>Thu ngân:</strong> thungan
    </span>
    <span class="demo-account-badge" onclick="fillCreds('ketoan', '123456')">
      <strong>Kế toán:</strong> ketoan
    </span>
    <span class="demo-account-badge" onclick="fillCreds('kythuat', '123456')">
      <strong>Kỹ thuật:</strong> kythuat
    </span>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
