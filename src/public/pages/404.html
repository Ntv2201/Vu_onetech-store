<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      text-align: center;
      max-width: 480px;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #3b82f6;
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="error-card">
  <div class="error-code">404</div>
  <h4 class="fw-bold mb-2">Trang không tồn tại</h4>
  <p class="text-muted mb-4">Đường dẫn bạn yêu cầu không tìm thấy hoặc đã bị di chuyển.</p>
  <a href="/index.html" class="btn btn-primary px-4">
    <i class="bi bi-house-door me-1"></i> Về Bảng điều khiển
  </a>
