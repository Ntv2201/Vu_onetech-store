<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Sản phẩm - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-1" id="detailTenMay">Đang tải...</h4>
          <div class="text-muted small" id="detailMeta">
            Hãng: <span class="fw-semibold text-dark" id="detailHang">...</span> | 
            Danh mục: <span class="fw-semibold text-dark" id="detailDanhMuc">...</span> | 
            Bảo hành: <span class="fw-semibold text-dark" id="detailSoThangBH">...</span>
          </div>
        </div>
        <div class="d-flex gap-2">
          <a href="#" id="btnImportImei" class="btn btn-success btn-sm">
            <i class="bi bi-plus-circle me-1"></i> Nhập thêm IMEI cho máy này
          </a>
          <a href="/san-pham/index.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Quay lại
          </a>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-12 col-md-4">
          <div class="card-custom p-4 text-center">
            <div class="text-muted small fw-semibold">GIÁ BÁN NIÊM YẾT</div>
            <div class="fs-3 fw-bold text-primary my-2" id="detailGiaBan">0 đ</div>
            <div class="text-muted small" id="detailMoTa">Chưa có ghi chú mô tả</div>
          </div>
        </div>

        <div class="col-12 col-md-8">
          <div class="card-custom">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
              <h6 class="fw-bold mb-0"><i class="bi bi-upc-scan me-2 text-primary"></i>Danh sách máy vật lý (Theo từng IMEI)</h6>
              <span class="badge bg-primary" id="detailBadgeCount">0 máy</span>
            </div>
            <div class="table-responsive">
              <table class="table table-custom table-hover">
                <thead>
                  <tr>
                    <th>Số IMEI</th>
                    <th>Màu sắc / Dung lượng</th>
                    <th>Giá nhập</th>
                    <th>Trạng thái</th>
                    <th>Ngày nhập</th>
                    <th class="text-end">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="detailTableImeis">
                  <tr>
                    <td colspan="6" class="text-center py-4">
                      <div class="spinner-border spinner-border-sm text-primary"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/sanpham.js"></script>
</body>
</html>
