<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Khuyến Mãi - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <!-- Header -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-1"><i class="bi bi-tags-fill text-primary me-2"></i>Quản lý Mã Khuyến Mãi</h4>
          <p class="text-muted small mb-0">Tạo mới, theo dõi trạng thái và hiệu lực của các chương trình giảm giá</p>
        </div>
        <div id="btnCreateContainer">
          <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#khuyenMaiModal" onclick="resetForm()">
            <i class="bi bi-plus-lg me-1"></i> Thêm Khuyến Mãi
          </button>
        </div>
      </div>

      <!-- Overview Stats Cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="card-custom p-3 d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-medium">Tổng số mã</div>
              <div class="fs-4 fw-bold text-dark mt-1" id="statTotalKM">0</div>
            </div>
            <div class="stat-icon primary">
              <i class="bi bi-ticket-perforated"></i>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card-custom p-3 d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-medium">Đang hoạt động</div>
              <div class="fs-4 fw-bold text-success mt-1" id="statActiveKM">0</div>
            </div>
            <div class="stat-icon success">
              <i class="bi bi-check-circle"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Card -->
      <div class="card-custom">
        <div class="card-header-custom d-flex flex-wrap justify-content-between align-items-center gap-2">
          <h6 class="fw-bold mb-0">Danh sách Khuyến Mãi</h6>
          <div class="d-flex gap-2">
            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Tìm tên hoặc mã...">
            </div>
            <select id="statusFilter" class="form-select form-select-sm" style="width: 140px;">
              <option value="">Tất cả</option>
              <option value="Hoat dong">Hoạt động</option>
              <option value="Het han">Hết hạn</option>
              <option value="Tam ngung">Tạm ngưng</option>
            </select>
          </div>
        </div>
        <div class="card-body-custom p-0">
          <div class="table-responsive">
            <table class="table table-custom mb-0">
              <thead>
                <tr>
                  <th>Mã KM</th>
                  <th>Chương trình</th>
                  <th>Giá trị giảm</th>
                  <th>Hiệu lực</th>
                  <th class="text-center">Lượt dùng</th>
                  <th class="text-center">Trạng thái</th>
                  <th class="text-end" style="width: 100px;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="kmTableBody">
                <tr>
                  <td colspan="7" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div> Đang tải dữ liệu...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Phân trang -->
        <div class="card-footer-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span class="text-muted small" id="paginationInfo">Hiển thị 0-0 trong tổng số 0 mã</span>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginationControls">
              <!-- Render by JS -->
            </ul>
          </nav>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Thêm/Sửa Khuyến Mãi -->
<div class="modal fade" id="khuyenMaiModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="khuyenMaiModalTitle">Thêm Khuyến Mãi Mới</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="khuyenMaiForm">
          <input type="hidden" id="kmId">
          
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-medium small">Mã KM <span class="text-muted">(Bỏ trống tự sinh)</span></label>
              <input type="text" class="form-control" id="maKM" placeholder="VD: TET2024">
            </div>
            <div class="col-md-8">
              <label class="form-label fw-medium small">Tên chương trình <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="tenKM" required placeholder="VD: Khuyến mãi Tết Dương Lịch">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-medium small">Loại giảm <span class="text-danger">*</span></label>
              <select class="form-select" id="loaiGiam" required>
                <option value="Phan tram">Giảm theo %</option>
                <option value="Truc tiep">Giảm trực tiếp tiền mặt</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-medium small">Giá trị giảm <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="giaTriGiam" required min="1" placeholder="VD: 10">
            </div>
            <div class="col-md-4" id="divGiaTriToiDa">
              <label class="form-label fw-medium small">Mức giảm tối đa (VNĐ)</label>
              <input type="number" class="form-control" id="giaTriToiDa" min="0" placeholder="0 = không giới hạn">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium small">Từ ngày <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="ngayBatDau" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-medium small">Đến ngày <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="ngayKetThuc" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium small">Số lượt dùng tối đa</label>
              <input type="number" class="form-control" id="soLuotToiDa" min="0" placeholder="0 = không giới hạn">
            </div>
            <div class="col-md-6" id="divTrangThai" style="display: none;">
              <label class="form-label fw-medium small">Trạng thái</label>
              <select class="form-select" id="trangThai">
                <option value="Hoat dong">Hoạt động</option>
                <option value="Tam ngung">Tạm ngưng</option>
                <option value="Het han">Hết hạn</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-medium small">Ghi chú</label>
              <textarea class="form-control" id="ghiChu" rows="2" placeholder="Ghi chú nội bộ..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-top-0 pt-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-primary px-4" id="btnSaveKM">Lưu Khuyến Mãi</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/khuyenmai.js"></script>

</body>
</html>
