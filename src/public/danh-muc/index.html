<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Danh mục - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-1">Quản lý Danh mục</h4>
          <p class="text-muted small mb-0">Phân loại sản phẩm (Điện thoại, iPad, Smartwatch, Phụ kiện, v.v.)</p>
        </div>
        <div id="btnCreateContainer">
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDanhMucModal">
            <i class="bi bi-plus-lg me-1"></i> Thêm Danh mục
          </button>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="card-custom">
            <div class="table-responsive">
              <table class="table table-custom table-hover">
                <thead>
                  <tr>
                    <th>Tên danh mục</th>
                    <th>Số lượng model SP</th>
                    <th>Số lượng phụ kiện</th>
                    <th class="text-end">Hành động</th>
                  </tr>
                </thead>
                <tbody id="tableDanhMucBody">
                  <tr>
                    <td colspan="4" class="text-center py-4">
                      <div class="spinner-border spinner-border-sm text-primary"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal Thêm Danh mục -->
<div class="modal fade" id="addDanhMucModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formAddDanhMuc">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Thêm Danh mục Mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
          <input type="text" id="inputAddTenDM" class="form-control" placeholder="VD: Điện thoại, Máy tính bảng, Phụ kiện..." required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Thêm danh mục</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Sửa Danh mục -->
<div class="modal fade" id="editDanhMucModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content text-start">
      <form id="formEditDanhMuc">
        <input type="hidden" id="inputEditDMId">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Chỉnh sửa Danh mục</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
          <input type="text" id="inputEditTenDM" class="form-control" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/danhmuc.js"></script>
</body>
</html>
